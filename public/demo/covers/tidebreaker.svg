<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-label="Tidebreaker cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061a26"/>
      <stop offset="1" stop-color="#041119"/>
    </linearGradient>
    <radialGradient id="glow" cx=".52" cy=".38" r=".55">
      <stop offset="0" stop-color="rgba(34, 211, 238, 0.28)"/>
      <stop offset="1" stop-color="rgba(34, 211, 238, 0)"/>
    </radialGradient>
    <radialGradient id="planetShade" cx=".32" cy=".24" r=".9">
      <stop offset="0" stop-color="rgba(255,255,255,.38)"/>
      <stop offset=".55" stop-color="rgba(255,255,255,0)"/>
      <stop offset="1" stop-color="rgba(0,0,0,.45)"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".52" stop-color="rgba(6, 26, 38, 0)"/>
      <stop offset="1" stop-color="rgba(6, 26, 38, 0.96)"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#glow)"/>
  <g filter="url(#soft)" opacity=".65">
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 120 700 A 380 380 0 0 1 880 700" stroke="#22d3ee" stroke-opacity=".72" stroke-width="5"/>
          <path d="M 200 700 A 300 300 0 0 1 800 700" stroke="#f8fafc" stroke-opacity=".55" stroke-width="3"/>
          <path d="M 280 700 A 220 220 0 0 1 720 700" stroke="#22d3ee" stroke-opacity=".4" stroke-width="2"/>
          <circle cx="500" cy="320" r="12" fill="#f8fafc"/>
          <circle cx="500" cy="320" r="42" stroke="rgba(248, 250, 252, 0.5)" stroke-width="1.5"/>
        </g></g>
  <g opacity=".94">
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 120 700 A 380 380 0 0 1 880 700" stroke="#22d3ee" stroke-opacity=".72" stroke-width="5"/>
          <path d="M 200 700 A 300 300 0 0 1 800 700" stroke="#f8fafc" stroke-opacity=".55" stroke-width="3"/>
          <path d="M 280 700 A 220 220 0 0 1 720 700" stroke="#22d3ee" stroke-opacity=".4" stroke-width="2"/>
          <circle cx="500" cy="320" r="12" fill="#f8fafc"/>
          <circle cx="500" cy="320" r="42" stroke="rgba(248, 250, 252, 0.5)" stroke-width="1.5"/>
        </g></g>
  <rect width="1000" height="1000" fill="url(#fade)"/>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".8"/>
  <g fill="#f7f5ef" font-family="Helvetica Neue, Inter, Arial, sans-serif">
    <text x="86" y="74" font-size="18" letter-spacing="5" opacity=".68">GAME SHELF</text>
    <text x="914" y="74" font-size="16" letter-spacing="3" text-anchor="end" opacity=".55">DEMO EDITION</text>
    <text x="86" y="720" font-size="78" font-weight="700" letter-spacing="-1"><tspan x="86" dy="0">Tidebreaker</tspan></text>
    <text x="86" y="902" font-size="22" letter-spacing="1" opacity=".68">Salt &amp; Signal</text>
    <text x="914" y="902" font-size="18" letter-spacing="2" text-anchor="end" opacity=".55">2026</text>
  </g>
  <rect x="86" y="936" width="828" height="1" fill="rgba(255,255,255,.22)"/>
  <text x="86" y="972" font-family="Helvetica Neue, Inter, Arial, sans-serif" font-size="15" letter-spacing="3" fill="rgba(255,255,255,.5)">FICTIONAL COLLECTION · OPEN SOURCE DEMO</text>
</svg>