<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-label="Pale Orbit cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1220"/>
      <stop offset="1" stop-color="#070c15"/>
    </linearGradient>
    <radialGradient id="glow" cx=".52" cy=".38" r=".55">
      <stop offset="0" stop-color="rgba(169, 198, 255, 0.28)"/>
      <stop offset="1" stop-color="rgba(169, 198, 255, 0)"/>
    </radialGradient>
    <radialGradient id="planetShade" cx=".32" cy=".24" r=".9">
      <stop offset="0" stop-color="rgba(255,255,255,.38)"/>
      <stop offset=".55" stop-color="rgba(255,255,255,0)"/>
      <stop offset="1" stop-color="rgba(0,0,0,.45)"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".52" stop-color="rgba(10, 18, 32, 0)"/>
      <stop offset="1" stop-color="rgba(10, 18, 32, 0.96)"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#glow)"/>
  <g filter="url(#soft)" opacity=".65">
        <g>
          <circle cx="500" cy="400" r="230" fill="rgba(169, 198, 255, 0.22)"/>
          <circle cx="500" cy="400" r="190" fill="rgba(169, 198, 255, 0.86)"/>
          <circle cx="572" cy="352" r="172" fill="rgba(10, 18, 32, 0.96)"/>
          <circle cx="500" cy="400" r="238" fill="none" stroke="rgba(255, 184, 107, 0.65)" stroke-width="2"/>
          <circle cx="500" cy="400" r="282" fill="none" stroke="rgba(169, 198, 255, 0.22)" stroke-width="1.5"/>
          <circle cx="724" cy="252" r="7" fill="#ffb86b"/>
          <circle cx="268" cy="522" r="4" fill="#a9c6ff"/>
        </g></g>
  <g opacity=".94">
        <g>
          <circle cx="500" cy="400" r="230" fill="rgba(169, 198, 255, 0.22)"/>
          <circle cx="500" cy="400" r="190" fill="rgba(169, 198, 255, 0.86)"/>
          <circle cx="572" cy="352" r="172" fill="rgba(10, 18, 32, 0.96)"/>
          <circle cx="500" cy="400" r="238" fill="none" stroke="rgba(255, 184, 107, 0.65)" stroke-width="2"/>
          <circle cx="500" cy="400" r="282" fill="none" stroke="rgba(169, 198, 255, 0.22)" stroke-width="1.5"/>
          <circle cx="724" cy="252" r="7" fill="#ffb86b"/>
          <circle cx="268" cy="522" r="4" fill="#a9c6ff"/>
        </g></g>
  <rect width="1000" height="1000" fill="url(#fade)"/>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".8"/>
  <g fill="#f7f5ef" font-family="Helvetica Neue, Inter, Arial, sans-serif">
    <text x="86" y="74" font-size="18" letter-spacing="5" opacity=".68">GAME SHELF</text>
    <text x="914" y="74" font-size="16" letter-spacing="3" text-anchor="end" opacity=".55">DEMO EDITION</text>
    <text x="86" y="720" font-size="78" font-weight="700" letter-spacing="-1"><tspan x="86" dy="0">Pale Orbit</tspan></text>
    <text x="86" y="902" font-size="22" letter-spacing="1" opacity=".68">Sundial Assembly</text>
    <text x="914" y="902" font-size="18" letter-spacing="2" text-anchor="end" opacity=".55">2026</text>
  </g>
  <rect x="86" y="936" width="828" height="1" fill="rgba(255,255,255,.22)"/>
  <text x="86" y="972" font-family="Helvetica Neue, Inter, Arial, sans-serif" font-size="15" letter-spacing="3" fill="rgba(255,255,255,.5)">FICTIONAL COLLECTION · OPEN SOURCE DEMO</text>
</svg>