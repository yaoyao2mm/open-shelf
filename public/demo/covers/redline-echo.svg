<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-label="Redline Echo cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16090c"/>
      <stop offset="1" stop-color="#0f0608"/>
    </linearGradient>
    <radialGradient id="glow" cx=".52" cy=".38" r=".55">
      <stop offset="0" stop-color="rgba(239, 68, 68, 0.28)"/>
      <stop offset="1" stop-color="rgba(239, 68, 68, 0)"/>
    </radialGradient>
    <radialGradient id="planetShade" cx=".32" cy=".24" r=".9">
      <stop offset="0" stop-color="rgba(255,255,255,.38)"/>
      <stop offset=".55" stop-color="rgba(255,255,255,0)"/>
      <stop offset="1" stop-color="rgba(0,0,0,.45)"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".52" stop-color="rgba(22, 9, 12, 0)"/>
      <stop offset="1" stop-color="rgba(22, 9, 12, 0.96)"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#glow)"/>
  <g filter="url(#soft)" opacity=".65">
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="500" cy="420" r="70" stroke="rgba(239, 68, 68, 0.5)" stroke-width="2" stroke-dasharray="none"/><circle cx="500" cy="420" r="112" stroke="rgba(251, 191, 36, 0.46)" stroke-width="2" stroke-dasharray="18 14"/><circle cx="500" cy="420" r="154" stroke="rgba(239, 68, 68, 0.42)" stroke-width="4" stroke-dasharray="none"/><circle cx="500" cy="420" r="196" stroke="rgba(251, 191, 36, 0.38)" stroke-width="2" stroke-dasharray="18 14"/><circle cx="500" cy="420" r="238" stroke="rgba(239, 68, 68, 0.33999999999999997)" stroke-width="2" stroke-dasharray="none"/><circle cx="500" cy="420" r="280" stroke="rgba(251, 191, 36, 0.3)" stroke-width="2" stroke-dasharray="18 14"/><circle cx="500" cy="420" r="322" stroke="rgba(239, 68, 68, 0.26)" stroke-width="2" stroke-dasharray="none"/>
          <circle cx="500" cy="420" r="20" fill="#fbbf24"/>
        </g></g>
  <g opacity=".94">
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="500" cy="420" r="70" stroke="rgba(239, 68, 68, 0.5)" stroke-width="2" stroke-dasharray="none"/><circle cx="500" cy="420" r="112" stroke="rgba(251, 191, 36, 0.46)" stroke-width="2" stroke-dasharray="18 14"/><circle cx="500" cy="420" r="154" stroke="rgba(239, 68, 68, 0.42)" stroke-width="4" stroke-dasharray="none"/><circle cx="500" cy="420" r="196" stroke="rgba(251, 191, 36, 0.38)" stroke-width="2" stroke-dasharray="18 14"/><circle cx="500" cy="420" r="238" stroke="rgba(239, 68, 68, 0.33999999999999997)" stroke-width="2" stroke-dasharray="none"/><circle cx="500" cy="420" r="280" stroke="rgba(251, 191, 36, 0.3)" stroke-width="2" stroke-dasharray="18 14"/><circle cx="500" cy="420" r="322" stroke="rgba(239, 68, 68, 0.26)" stroke-width="2" stroke-dasharray="none"/>
          <circle cx="500" cy="420" r="20" fill="#fbbf24"/>
        </g></g>
  <rect width="1000" height="1000" fill="url(#fade)"/>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".8"/>
  <g fill="#f7f5ef" font-family="Helvetica Neue, Inter, Arial, sans-serif">
    <text x="86" y="74" font-size="18" letter-spacing="5" opacity=".68">GAME SHELF</text>
    <text x="914" y="74" font-size="16" letter-spacing="3" text-anchor="end" opacity=".55">DEMO EDITION</text>
    <text x="86" y="720" font-size="78" font-weight="700" letter-spacing="-1"><tspan x="86" dy="0">Redline Echo</tspan></text>
    <text x="86" y="902" font-size="22" letter-spacing="1" opacity=".68">Afterglow Racing</text>
    <text x="914" y="902" font-size="18" letter-spacing="2" text-anchor="end" opacity=".55">2025</text>
  </g>
  <rect x="86" y="936" width="828" height="1" fill="rgba(255,255,255,.22)"/>
  <text x="86" y="972" font-family="Helvetica Neue, Inter, Arial, sans-serif" font-size="15" letter-spacing="3" fill="rgba(255,255,255,.5)">FICTIONAL COLLECTION · OPEN SOURCE DEMO</text>
</svg>