<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-label="Starforge Saga cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120a2a"/>
      <stop offset="1" stop-color="#0c071c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".52" cy=".38" r=".55">
      <stop offset="0" stop-color="rgba(157, 140, 255, 0.28)"/>
      <stop offset="1" stop-color="rgba(157, 140, 255, 0)"/>
    </radialGradient>
    <radialGradient id="planetShade" cx=".32" cy=".24" r=".9">
      <stop offset="0" stop-color="rgba(255,255,255,.38)"/>
      <stop offset=".55" stop-color="rgba(255,255,255,0)"/>
      <stop offset="1" stop-color="rgba(0,0,0,.45)"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".52" stop-color="rgba(18, 10, 42, 0)"/>
      <stop offset="1" stop-color="rgba(18, 10, 42, 0.96)"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#glow)"/>
  <g filter="url(#soft)" opacity=".65">
        <g>
          <polygon points="500,170 820,690 180,690" fill="rgba(157, 140, 255, 0.2)" stroke="rgba(157, 140, 255, 0.65)" stroke-width="3"/>
          <polygon points="500,280 740,650 260,650" fill="rgba(242, 193, 78, 0.16)" stroke="rgba(242, 193, 78, 0.55)" stroke-width="2"/>
          <polygon points="500,390 650,620 350,620" fill="rgba(157, 140, 255, 0.28)" stroke="rgba(157, 140, 255, 0.8)" stroke-width="2"/>
          <line x1="500" y1="120" x2="500" y2="720" stroke="rgba(242, 193, 78, 0.3)" stroke-width="1.5"/>
        </g></g>
  <g opacity=".94">
        <g>
          <polygon points="500,170 820,690 180,690" fill="rgba(157, 140, 255, 0.2)" stroke="rgba(157, 140, 255, 0.65)" stroke-width="3"/>
          <polygon points="500,280 740,650 260,650" fill="rgba(242, 193, 78, 0.16)" stroke="rgba(242, 193, 78, 0.55)" stroke-width="2"/>
          <polygon points="500,390 650,620 350,620" fill="rgba(157, 140, 255, 0.28)" stroke="rgba(157, 140, 255, 0.8)" stroke-width="2"/>
          <line x1="500" y1="120" x2="500" y2="720" stroke="rgba(242, 193, 78, 0.3)" stroke-width="1.5"/>
        </g></g>
  <rect width="1000" height="1000" fill="url(#fade)"/>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".8"/>
  <g fill="#f7f5ef" font-family="Helvetica Neue, Inter, Arial, sans-serif">
    <text x="86" y="74" font-size="18" letter-spacing="5" opacity=".68">GAME SHELF</text>
    <text x="914" y="74" font-size="16" letter-spacing="3" text-anchor="end" opacity=".55">DEMO EDITION</text>
    <text x="86" y="720" font-size="78" font-weight="700" letter-spacing="-1"><tspan x="86" dy="0">Starforge Saga</tspan></text>
    <text x="86" y="902" font-size="22" letter-spacing="1" opacity=".68">Vesper Interactive</text>
    <text x="914" y="902" font-size="18" letter-spacing="2" text-anchor="end" opacity=".55">2026</text>
  </g>
  <rect x="86" y="936" width="828" height="1" fill="rgba(255,255,255,.22)"/>
  <text x="86" y="972" font-family="Helvetica Neue, Inter, Arial, sans-serif" font-size="15" letter-spacing="3" fill="rgba(255,255,255,.5)">FICTIONAL COLLECTION · OPEN SOURCE DEMO</text>
</svg>