          <circle cx="500" cy="410" r="102" fill="rgba(255, 122, 61, 0.9)"/>
          <circle cx="500" cy="410" r="54" fill="rgba(42, 11, 8, 0.8)"/>
          <circle cx="500" cy="410" r="18" fill="#ffd166"/>
        </g></g>
  <rect width="1000" height="1000" fill="url(#fade)"/>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".8"/>
