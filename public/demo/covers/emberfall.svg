<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-label="Emberfall cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0b08"/>
      <stop offset="1" stop-color="#1c0705"/>
    </linearGradient>
    <radialGradient id="glow" cx=".52" cy=".38" r=".55">
      <stop offset="0" stop-color="rgba(255, 122, 61, 0.28)"/>
      <stop offset="1" stop-color="rgba(255, 122, 61, 0)"/>
    </radialGradient>
    <radialGradient id="planetShade" cx=".32" cy=".24" r=".9">
      <stop offset="0" stop-color="rgba(255,255,255,.38)"/>
      <stop offset=".55" stop-color="rgba(255,255,255,0)"/>
      <stop offset="1" stop-color="rgba(0,0,0,.45)"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".52" stop-color="rgba(42, 11, 8, 0)"/>
      <stop offset="1" stop-color="rgba(42, 11, 8, 0.96)"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#glow)"/>
  <g filter="url(#soft)" opacity=".65">
