  <g opacity=".94"><g><rect x="170" y="570" width="48" height="130" rx="6" fill="rgba(159, 211, 86, 0.24)" stroke="rgba(159, 211, 86, 0.55)" stroke-width="2"/><rect x="270" y="491" width="66" height="209" rx="6" fill="rgba(224, 164, 88, 0.24)" stroke="rgba(224, 164, 88, 0.55)" stroke-width="2"/><rect x="370" y="412" width="84" height="288" rx="6" fill="rgba(159, 211, 86, 0.24)" stroke="rgba(159, 211, 86, 0.55)" stroke-width="2"/><rect x="470" y="333" width="48" height="367" rx="6" fill="rgba(224, 164, 88, 0.24)" stroke="rgba(224, 164, 88, 0.55)" stroke-width="2"/><rect x="570" y="514" width="66" height="186" rx="6" fill="rgba(159, 211, 86, 0.24)" stroke="rgba(159, 211, 86, 0.55)" stroke-width="2"/><rect x="670" y="435" width="84" height="265" rx="6" fill="rgba(224, 164, 88, 0.24)" stroke="rgba(224, 164, 88, 0.55)" stroke-width="2"/><rect x="770" y="356" width="48" height="344" rx="6" fill="rgba(159, 211, 86, 0.24)" stroke="rgba(159, 211, 86, 0.55)" stroke-width="2"/><line x1="120" y1="700" x2="880" y2="700" stroke="rgba(159, 211, 86, 0.5)" stroke-width="2"/></g></g>
  <rect width="1000" height="1000" fill="url(#fade)"/>
