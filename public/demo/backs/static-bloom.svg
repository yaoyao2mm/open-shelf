<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-label="Static Bloom back cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a080e"/>
      <stop offset="1" stop-color="#050407"/>
    </linearGradient>
    <radialGradient id="glow" cx=".7" cy=".2" r=".7">
      <stop offset="0" stop-color="rgba(192, 132, 252, 0.24)"/>
      <stop offset="1" stop-color="rgba(192, 132, 252, 0)"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".045"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#glow)"/>
  <g opacity=".24" filter="url(#soft)" transform="translate(0 40)">
        <g>
          <ellipse cx="500" cy="300" rx="58" ry="172" fill="rgba(192, 132, 252, 0.34)" transform="rotate(0 500 410)"/><ellipse cx="500" cy="300" rx="58" ry="172" fill="rgba(244, 114, 182, 0.34)" transform="rotate(30 500 410)"/><ellipse cx="500" cy="300" rx="58" ry="172" fill="rgba(192, 132, 252, 0.34)" transform="rotate(60 500 410)"/><ellipse cx="500" cy="300" rx="58" ry="172" fill="rgba(244, 114, 182, 0.34)" transform="rotate(90 500 410)"/><ellipse cx="500" cy="300" rx="58" ry="172" fill="rgba(192, 132, 252, 0.34)" transform="rotate(120 500 410)"/><ellipse cx="500" cy="300" rx="58" ry="172" fill="rgba(244, 114, 182, 0.34)" transform="rotate(150 500 410)"/><ellipse cx="500" cy="300" rx="58" ry="172" fill="rgba(192, 132, 252, 0.34)" transform="rotate(180 500 410)"/><ellipse cx="500" cy="300" rx="58" ry="172" fill="rgba(244, 114, 182, 0.34)" transform="rotate(210 500 410)"/><ellipse cx="500" cy="300" rx="58" ry="172" fill="rgba(192, 132, 252, 0.34)" transform="rotate(240 500 410)"/><ellipse cx="500" cy="300" rx="58" ry="172" fill="rgba(244, 114, 182, 0.34)" transform="rotate(270 500 410)"/><ellipse cx="500" cy="300" rx="58" ry="172" fill="rgba(192, 132, 252, 0.34)" transform="rotate(300 500 410)"/><ellipse cx="500" cy="300" rx="58" ry="172" fill="rgba(244, 114, 182, 0.34)" transform="rotate(330 500 410)"/>
          <circle cx="500" cy="410" r="102" fill="rgba(192, 132, 252, 0.9)"/>
          <circle cx="500" cy="410" r="54" fill="rgba(13, 10, 18, 0.8)"/>
          <circle cx="500" cy="410" r="18" fill="#f472b6"/>
        </g></g>
  <g fill="#f7f5ef" font-family="Helvetica Neue, Inter, Arial, sans-serif">
    <text x="86" y="92" font-size="18" letter-spacing="5" opacity=".6">GAME SHELF</text>
    <text x="86" y="188" font-size="52" font-weight="700" letter-spacing="-1">Static Bloom</text>
    <text x="86" y="234" font-size="20" letter-spacing="1" opacity=".62">Quiet Current · 2024</text>
    <line x1="86" y1="272" x2="914" y2="272" stroke="rgba(255,255,255,.22)"/>
    <text x="86" y="330" font-size="15" letter-spacing="4" fill="#c084fc">ABOUT THIS EDITION</text>
    <text x="86" y="384" font-size="22" fill="rgba(247,245,239,.82)" font-family="Helvetica Neue, Inter, Arial, sans-serif">A fictional survival horror game set in an abandoned</text><text x="86" y="422" font-size="22" fill="rgba(247,245,239,.82)" font-family="Helvetica Neue, Inter, Arial, sans-serif">television archive. The tapes are alive, the</text><text x="86" y="460" font-size="22" fill="rgba(247,245,239,.82)" font-family="Helvetica Neue, Inter, Arial, sans-serif">corridors rearrange themselves, and the only safe</text><text x="86" y="498" font-size="22" fill="rgba(247,245,239,.82)" font-family="Helvetica Neue, Inter, Arial, sans-serif">room is the one you have not watched yet.</text>
    <text x="86" y="676" font-size="15" letter-spacing="4" fill="#f472b6">IN THE BOX</text>
    <text x="86" y="718" font-size="21" opacity=".8">One disc · one fictional world · zero downloads</text>
    <text x="86" y="756" font-size="21" opacity=".8">A demo entry for the open-source shelf</text>
    <text x="86" y="840" font-size="14" letter-spacing="3" opacity=".45">CATALOGUE STATIC-BLOOM</text>
    <text x="86" y="920" font-size="14" opacity=".45">Demo artwork generated by scripts/generate-demo-art.mjs</text>
  </g>
  <g fill="rgba(247,245,239,.86)">
    <rect x="772" y="806" width="2" height="62"/><rect x="776" y="806" width="1" height="48"/><rect x="780" y="806" width="1" height="48"/><rect x="784" y="806" width="1" height="48"/><rect x="788" y="806" width="2" height="48"/><rect x="792" y="806" width="1" height="62"/><rect x="796" y="806" width="1" height="48"/><rect x="800" y="806" width="1" height="48"/><rect x="804" y="806" width="2" height="48"/><rect x="808" y="806" width="1" height="48"/><rect x="812" y="806" width="1" height="62"/><rect x="816" y="806" width="1" height="48"/><rect x="820" y="806" width="2" height="48"/><rect x="824" y="806" width="1" height="48"/><rect x="828" y="806" width="1" height="48"/><rect x="832" y="806" width="1" height="62"/><rect x="836" y="806" width="2" height="48"/><rect x="840" y="806" width="1" height="48"/><rect x="844" y="806" width="1" height="48"/><rect x="848" y="806" width="1" height="48"/><rect x="852" y="806" width="2" height="62"/><rect x="856" y="806" width="1" height="48"/><rect x="860" y="806" width="1" height="48"/><rect x="864" y="806" width="1" height="48"/><rect x="868" y="806" width="2" height="48"/><rect x="872" y="806" width="1" height="62"/><rect x="876" y="806" width="1" height="48"/><rect x="880" y="806" width="1" height="48"/><rect x="884" y="806" width="2" height="48"/><rect x="888" y="806" width="1" height="48"/><rect x="892" y="806" width="1" height="62"/><rect x="896" y="806" width="1" height="48"/><rect x="900" y="806" width="2" height="48"/><rect x="904" y="806" width="1" height="48"/><rect x="908" y="806" width="1" height="48"/><rect x="912" y="806" width="1" height="62"/><rect x="916" y="806" width="2" height="48"/><rect x="920" y="806" width="1" height="48"/>
