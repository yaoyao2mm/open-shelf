    <text x="86" y="92" font-size="18" letter-spacing="5" opacity=".6">GAME SHELF</text>
    <text x="86" y="188" font-size="52" font-weight="700" letter-spacing="-1">Warden of Dust</text>
    <text x="86" y="234" font-size="20" letter-spacing="1" opacity=".62">Red Mesa Games · 2025</text>
    <line x1="86" y1="272" x2="914" y2="272" stroke="rgba(255,255,255,.22)"/>
    <text x="86" y="330" font-size="15" letter-spacing="4" fill="#e0a458">ABOUT THIS EDITION</text>
    <text x="86" y="384" font-size="22" fill="rgba(247,245,239,.82)" font-family="Helvetica Neue, Inter, Arial, sans-serif">A fictional role-playing game about a wandering</text><text x="86" y="422" font-size="22" fill="rgba(247,245,239,.82)" font-family="Helvetica Neue, Inter, Arial, sans-serif">warden who carries the memories of a vanished town.</text><text x="86" y="460" font-size="22" fill="rgba(247,245,239,.82)" font-family="Helvetica Neue, Inter, Arial, sans-serif">Trade stories for safe passage, and decide which</text><text x="86" y="498" font-size="22" fill="rgba(247,245,239,.82)" font-family="Helvetica Neue, Inter, Arial, sans-serif">memories are worth keeping.</text>
    <text x="86" y="676" font-size="15" letter-spacing="4" fill="#c97b63">IN THE BOX</text>
    <text x="86" y="718" font-size="21" opacity=".8">One disc · one fictional world · zero downloads</text>
    <text x="86" y="756" font-size="21" opacity=".8">A demo entry for the open-source shelf</text>
    <text x="86" y="840" font-size="14" letter-spacing="3" opacity=".45">CATALOGUE WARDEN-OF-DUST</text>
    <text x="86" y="920" font-size="14" opacity=".45">Demo artwork generated by scripts/generate-demo-art.mjs</text>
