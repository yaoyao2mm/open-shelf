<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-label="Glass Harbor back cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061317"/>
      <stop offset="1" stop-color="#030a0c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".7" cy=".2" r=".7">
      <stop offset="0" stop-color="rgba(103, 232, 249, 0.24)"/>
      <stop offset="1" stop-color="rgba(103, 232, 249, 0)"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".045"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#glow)"/>
  <g opacity=".24" filter="url(#soft)" transform="translate(0 40)"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M -20 270 C 160 180, 330 360, 510 270 S 840 180, 1020 270" stroke="rgba(103, 232, 249, 0.5)" stroke-width="3"/><path d="M -20 316 C 160 226, 330 406, 510 316 S 840 226, 1020 316" stroke="rgba(254, 243, 199, 0.5)" stroke-width="4"/><path d="M -20 362 C 160 272, 330 452, 510 362 S 840 272, 1020 362" stroke="rgba(103, 232, 249, 0.5)" stroke-width="5"/><path d="M -20 408 C 160 318, 330 498, 510 408 S 840 318, 1020 408" stroke="rgba(254, 243, 199, 0.5)" stroke-width="3"/><path d="M -20 454 C 160 364, 330 544, 510 454 S 840 364, 1020 454" stroke="rgba(103, 232, 249, 0.5)" stroke-width="4"/><path d="M -20 500 C 160 410, 330 590, 510 500 S 840 410, 1020 500" stroke="rgba(254, 243, 199, 0.5)" stroke-width="5"/><path d="M -20 546 C 160 456, 330 636, 510 546 S 840 456, 1020 546" stroke="rgba(103, 232, 249, 0.5)" stroke-width="3"/></g></g>
  <g fill="#f7f5ef" font-family="Helvetica Neue, Inter, Arial, sans-serif">
    <text x="86" y="92" font-size="18" letter-spacing="5" opacity=".6">GAME SHELF</text>
    <text x="86" y="188" font-size="52" font-weight="700" letter-spacing="-1">Glass Harbor</text>
    <text x="86" y="234" font-size="20" letter-spacing="1" opacity=".62">Tide Table · 2023</text>
    <line x1="86" y1="272" x2="914" y2="272" stroke="rgba(255,255,255,.22)"/>
    <text x="86" y="330" font-size="15" letter-spacing="4" fill="#67e8f9">ABOUT THIS EDITION</text>
    <text x="86" y="384" font-size="22" fill="rgba(247,245,239,.82)" font-family="Helvetica Neue, Inter, Arial, sans-serif">A fictional adventure about a harbour town rebuilt</text><text x="86" y="422" font-size="22" fill="rgba(247,245,239,.82)" font-family="Helvetica Neue, Inter, Arial, sans-serif">every generation from the sea glass that washes</text><text x="86" y="460" font-size="22" fill="rgba(247,245,239,.82)" font-family="Helvetica Neue, Inter, Arial, sans-serif">ashore. Talk to the keepers, repair the lighthouse,</text><text x="86" y="498" font-size="22" fill="rgba(247,245,239,.82)" font-family="Helvetica Neue, Inter, Arial, sans-serif">and learn why the town keeps coming back.</text>
    <text x="86" y="676" font-size="15" letter-spacing="4" fill="#fef3c7">IN THE BOX</text>
    <text x="86" y="718" font-size="21" opacity=".8">One disc · one fictional world · zero downloads</text>
    <text x="86" y="756" font-size="21" opacity=".8">A demo entry for the open-source shelf</text>
    <text x="86" y="840" font-size="14" letter-spacing="3" opacity=".45">CATALOGUE GLASS-HARBOR</text>
    <text x="86" y="920" font-size="14" opacity=".45">Demo artwork generated by scripts/generate-demo-art.mjs</text>
  </g>
  <g fill="rgba(247,245,239,.86)">
    <rect x="772" y="806" width="2" height="62"/><rect x="776" y="806" width="1" height="48"/><rect x="780" y="806" width="1" height="48"/><rect x="784" y="806" width="1" height="48"/><rect x="788" y="806" width="2" height="48"/><rect x="792" y="806" width="1" height="62"/><rect x="796" y="806" width="1" height="48"/><rect x="800" y="806" width="1" height="48"/><rect x="804" y="806" width="2" height="48"/><rect x="808" y="806" width="1" height="48"/><rect x="812" y="806" width="1" height="62"/><rect x="816" y="806" width="1" height="48"/><rect x="820" y="806" width="2" height="48"/><rect x="824" y="806" width="1" height="48"/><rect x="828" y="806" width="1" height="48"/><rect x="832" y="806" width="1" height="62"/><rect x="836" y="806" width="2" height="48"/><rect x="840" y="806" width="1" height="48"/><rect x="844" y="806" width="1" height="48"/><rect x="848" y="806" width="1" height="48"/><rect x="852" y="806" width="2" height="62"/><rect x="856" y="806" width="1" height="48"/><rect x="860" y="806" width="1" height="48"/><rect x="864" y="806" width="1" height="48"/><rect x="868" y="806" width="2" height="48"/><rect x="872" y="806" width="1" height="62"/><rect x="876" y="806" width="1" height="48"/><rect x="880" y="806" width="1" height="48"/><rect x="884" y="806" width="2" height="48"/><rect x="888" y="806" width="1" height="48"/><rect x="892" y="806" width="1" height="62"/><rect x="896" y="806" width="1" height="48"/><rect x="900" y="806" width="2" height="48"/><rect x="904" y="806" width="1" height="48"/><rect x="908" y="806" width="1" height="48"/><rect x="912" y="806" width="1" height="62"/><rect x="916" y="806" width="2" height="48"/><rect x="920" y="806" width="1" height="48"/>
