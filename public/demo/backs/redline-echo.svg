<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-label="Redline Echo back cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12070a"/>
      <stop offset="1" stop-color="#090405"/>
    </linearGradient>
    <radialGradient id="glow" cx=".7" cy=".2" r=".7">
      <stop offset="0" stop-color="rgba(239, 68, 68, 0.24)"/>
      <stop offset="1" stop-color="rgba(239, 68, 68, 0)"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".045"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#glow)"/>
  <g opacity=".24" filter="url(#soft)" transform="translate(0 40)">
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="500" cy="420" r="70" stroke="rgba(239, 68, 68, 0.5)" stroke-width="2" stroke-dasharray="none"/><circle cx="500" cy="420" r="112" stroke="rgba(251, 191, 36, 0.46)" stroke-width="2" stroke-dasharray="18 14"/><circle cx="500" cy="420" r="154" stroke="rgba(239, 68, 68, 0.42)" stroke-width="4" stroke-dasharray="none"/><circle cx="500" cy="420" r="196" stroke="rgba(251, 191, 36, 0.38)" stroke-width="2" stroke-dasharray="18 14"/><circle cx="500" cy="420" r="238" stroke="rgba(239, 68, 68, 0.33999999999999997)" stroke-width="2" stroke-dasharray="none"/><circle cx="500" cy="420" r="280" stroke="rgba(251, 191, 36, 0.3)" stroke-width="2" stroke-dasharray="18 14"/><circle cx="500" cy="420" r="322" stroke="rgba(239, 68, 68, 0.26)" stroke-width="2" stroke-dasharray="none"/>
          <circle cx="500" cy="420" r="20" fill="#fbbf24"/>
        </g></g>
  <g fill="#f7f5ef" font-family="Helvetica Neue, Inter, Arial, sans-serif">
    <text x="86" y="92" font-size="18" letter-spacing="5" opacity=".6">GAME SHELF</text>
    <text x="86" y="188" font-size="52" font-weight="700" letter-spacing="-1">Redline Echo</text>
    <text x="86" y="234" font-size="20" letter-spacing="1" opacity=".62">Afterglow Racing · 2025</text>
    <line x1="86" y1="272" x2="914" y2="272" stroke="rgba(255,255,255,.22)"/>
    <text x="86" y="330" font-size="15" letter-spacing="4" fill="#ef4444">ABOUT THIS EDITION</text>
    <text x="86" y="384" font-size="22" fill="rgba(247,245,239,.82)" font-family="Helvetica Neue, Inter, Arial, sans-serif">A fictional time-loop racing game. Every lap leaves</text><text x="86" y="422" font-size="22" fill="rgba(247,245,239,.82)" font-family="Helvetica Neue, Inter, Arial, sans-serif">a recording of your last run on the track, and the</text><text x="86" y="460" font-size="22" fill="rgba(247,245,239,.82)" font-family="Helvetica Neue, Inter, Arial, sans-serif">only way forward is to outdrive every version of</text><text x="86" y="498" font-size="22" fill="rgba(247,245,239,.82)" font-family="Helvetica Neue, Inter, Arial, sans-serif">yourself.</text>
    <text x="86" y="676" font-size="15" letter-spacing="4" fill="#fbbf24">IN THE BOX</text>
    <text x="86" y="718" font-size="21" opacity=".8">One disc · one fictional world · zero downloads</text>
    <text x="86" y="756" font-size="21" opacity=".8">A demo entry for the open-source shelf</text>
    <text x="86" y="840" font-size="14" letter-spacing="3" opacity=".45">CATALOGUE REDLINE-ECHO</text>
    <text x="86" y="920" font-size="14" opacity=".45">Demo artwork generated by scripts/generate-demo-art.mjs</text>
  </g>
  <g fill="rgba(247,245,239,.86)">
    <rect x="772" y="806" width="2" height="62"/><rect x="776" y="806" width="1" height="48"/><rect x="780" y="806" width="1" height="48"/><rect x="784" y="806" width="1" height="48"/><rect x="788" y="806" width="2" height="48"/><rect x="792" y="806" width="1" height="62"/><rect x="796" y="806" width="1" height="48"/><rect x="800" y="806" width="1" height="48"/><rect x="804" y="806" width="2" height="48"/><rect x="808" y="806" width="1" height="48"/><rect x="812" y="806" width="1" height="62"/><rect x="816" y="806" width="1" height="48"/><rect x="820" y="806" width="2" height="48"/><rect x="824" y="806" width="1" height="48"/><rect x="828" y="806" width="1" height="48"/><rect x="832" y="806" width="1" height="62"/><rect x="836" y="806" width="2" height="48"/><rect x="840" y="806" width="1" height="48"/><rect x="844" y="806" width="1" height="48"/><rect x="848" y="806" width="1" height="48"/><rect x="852" y="806" width="2" height="62"/><rect x="856" y="806" width="1" height="48"/><rect x="860" y="806" width="1" height="48"/><rect x="864" y="806" width="1" height="48"/><rect x="868" y="806" width="2" height="48"/><rect x="872" y="806" width="1" height="62"/><rect x="876" y="806" width="1" height="48"/><rect x="880" y="806" width="1" height="48"/><rect x="884" y="806" width="2" height="48"/><rect x="888" y="806" width="1" height="48"/><rect x="892" y="806" width="1" height="62"/><rect x="896" y="806" width="1" height="48"/><rect x="900" y="806" width="2" height="48"/><rect x="904" y="806" width="1" height="48"/><rect x="908" y="806" width="1" height="48"/><rect x="912" y="806" width="1" height="62"/><rect x="916" y="806" width="2" height="48"/><rect x="920" y="806" width="1" height="48"/>
  </g>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".8"/>
</svg>