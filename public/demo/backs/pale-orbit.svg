<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-label="Pale Orbit back cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080e1a"/>
      <stop offset="1" stop-color="#04070d"/>
    </linearGradient>
    <radialGradient id="glow" cx=".7" cy=".2" r=".7">
      <stop offset="0" stop-color="rgba(169, 198, 255, 0.24)"/>
      <stop offset="1" stop-color="rgba(169, 198, 255, 0)"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".045"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#glow)"/>
  <g opacity=".24" filter="url(#soft)" transform="translate(0 40)">
        <g>
          <circle cx="500" cy="400" r="230" fill="rgba(169, 198, 255, 0.22)"/>
          <circle cx="500" cy="400" r="190" fill="rgba(169, 198, 255, 0.86)"/>
          <circle cx="572" cy="352" r="172" fill="rgba(10, 18, 32, 0.96)"/>
          <circle cx="500" cy="400" r="238" fill="none" stroke="rgba(255, 184, 107, 0.65)" stroke-width="2"/>
          <circle cx="500" cy="400" r="282" fill="none" stroke="rgba(169, 198, 255, 0.22)" stroke-width="1.5"/>
          <circle cx="724" cy="252" r="7" fill="#ffb86b"/>
          <circle cx="268" cy="522" r="4" fill="#a9c6ff"/>
        </g></g>
  <g fill="#f7f5ef" font-family="Helvetica Neue, Inter, Arial, sans-serif">
    <text x="86" y="92" font-size="18" letter-spacing="5" opacity=".6">GAME SHELF</text>
    <text x="86" y="188" font-size="52" font-weight="700" letter-spacing="-1">Pale Orbit</text>
    <text x="86" y="234" font-size="20" letter-spacing="1" opacity=".62">Sundial Assembly · 2026</text>
    <line x1="86" y1="272" x2="914" y2="272" stroke="rgba(255,255,255,.22)"/>
    <text x="86" y="330" font-size="15" letter-spacing="4" fill="#a9c6ff">ABOUT THIS EDITION</text>
    <text x="86" y="384" font-size="22" fill="rgba(247,245,239,.82)" font-family="Helvetica Neue, Inter, Arial, sans-serif">A fictional science-fiction adventure about the last</text><text x="86" y="422" font-size="22" fill="rgba(247,245,239,.82)" font-family="Helvetica Neue, Inter, Arial, sans-serif">crew on a solar observatory. Repair the mirror</text><text x="86" y="460" font-size="22" fill="rgba(247,245,239,.82)" font-family="Helvetica Neue, Inter, Arial, sans-serif">array, argue with the ship's archivist, and decide</text><text x="86" y="498" font-size="22" fill="rgba(247,245,239,.82)" font-family="Helvetica Neue, Inter, Arial, sans-serif">what to send home before the light goes out.</text>
    <text x="86" y="676" font-size="15" letter-spacing="4" fill="#ffb86b">IN THE BOX</text>
    <text x="86" y="718" font-size="21" opacity=".8">One disc · one fictional world · zero downloads</text>
    <text x="86" y="756" font-size="21" opacity=".8">A demo entry for the open-source shelf</text>
    <text x="86" y="840" font-size="14" letter-spacing="3" opacity=".45">CATALOGUE PALE-ORBIT</text>
    <text x="86" y="920" font-size="14" opacity=".45">Demo artwork generated by scripts/generate-demo-art.mjs</text>
  </g>
  <g fill="rgba(247,245,239,.86)">
