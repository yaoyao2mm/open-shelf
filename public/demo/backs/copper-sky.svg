<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-label="Copper Sky back cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#150c08"/>
      <stop offset="1" stop-color="#0a0604"/>
    </linearGradient>
    <radialGradient id="glow" cx=".7" cy=".2" r=".7">
      <stop offset="0" stop-color="rgba(245, 158, 11, 0.24)"/>
      <stop offset="1" stop-color="rgba(245, 158, 11, 0)"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".045"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#glow)"/>
  <g opacity=".24" filter="url(#soft)" transform="translate(0 40)"><g><rect x="170" y="570" width="48" height="130" rx="6" fill="rgba(245, 158, 11, 0.24)" stroke="rgba(245, 158, 11, 0.55)" stroke-width="2"/><rect x="270" y="491" width="66" height="209" rx="6" fill="rgba(125, 211, 252, 0.24)" stroke="rgba(125, 211, 252, 0.55)" stroke-width="2"/><rect x="370" y="412" width="84" height="288" rx="6" fill="rgba(245, 158, 11, 0.24)" stroke="rgba(245, 158, 11, 0.55)" stroke-width="2"/><rect x="470" y="333" width="48" height="367" rx="6" fill="rgba(125, 211, 252, 0.24)" stroke="rgba(125, 211, 252, 0.55)" stroke-width="2"/><rect x="570" y="514" width="66" height="186" rx="6" fill="rgba(245, 158, 11, 0.24)" stroke="rgba(245, 158, 11, 0.55)" stroke-width="2"/><rect x="670" y="435" width="84" height="265" rx="6" fill="rgba(125, 211, 252, 0.24)" stroke="rgba(125, 211, 252, 0.55)" stroke-width="2"/><rect x="770" y="356" width="48" height="344" rx="6" fill="rgba(245, 158, 11, 0.24)" stroke="rgba(245, 158, 11, 0.55)" stroke-width="2"/><line x1="120" y1="700" x2="880" y2="700" stroke="rgba(245, 158, 11, 0.5)" stroke-width="2"/></g></g>
  <g fill="#f7f5ef" font-family="Helvetica Neue, Inter, Arial, sans-serif">
    <text x="86" y="92" font-size="18" letter-spacing="5" opacity=".6">GAME SHELF</text>
    <text x="86" y="188" font-size="52" font-weight="700" letter-spacing="-1">Copper Sky</text>
    <text x="86" y="234" font-size="20" letter-spacing="1" opacity=".62">Red Mesa Games · 2025</text>
    <line x1="86" y1="272" x2="914" y2="272" stroke="rgba(255,255,255,.22)"/>
    <text x="86" y="330" font-size="15" letter-spacing="4" fill="#f59e0b">ABOUT THIS EDITION</text>
    <text x="86" y="384" font-size="22" fill="rgba(247,245,239,.82)" font-family="Helvetica Neue, Inter, Arial, sans-serif">A fictional adventure about a mail pilot flying the</text><text x="86" y="422" font-size="22" fill="rgba(247,245,239,.82)" font-family="Helvetica Neue, Inter, Arial, sans-serif">last route between two shrinking towns. Carry</text><text x="86" y="460" font-size="22" fill="rgba(247,245,239,.82)" font-family="Helvetica Neue, Inter, Arial, sans-serif">letters, dodge storms, and decide what the route is</text><text x="86" y="498" font-size="22" fill="rgba(247,245,239,.82)" font-family="Helvetica Neue, Inter, Arial, sans-serif">really keeping alive.</text>
    <text x="86" y="676" font-size="15" letter-spacing="4" fill="#7dd3fc">IN THE BOX</text>
    <text x="86" y="718" font-size="21" opacity=".8">One disc · one fictional world · zero downloads</text>
    <text x="86" y="756" font-size="21" opacity=".8">A demo entry for the open-source shelf</text>
    <text x="86" y="840" font-size="14" letter-spacing="3" opacity=".45">CATALOGUE COPPER-SKY</text>
    <text x="86" y="920" font-size="14" opacity=".45">Demo artwork generated by scripts/generate-demo-art.mjs</text>
  </g>
  <g fill="rgba(247,245,239,.86)">
    <rect x="772" y="806" width="2" height="62"/><rect x="776" y="806" width="1" height="48"/><rect x="780" y="806" width="1" height="48"/><rect x="784" y="806" width="1" height="48"/><rect x="788" y="806" width="2" height="48"/><rect x="792" y="806" width="1" height="62"/><rect x="796" y="806" width="1" height="48"/><rect x="800" y="806" width="1" height="48"/><rect x="804" y="806" width="2" height="48"/><rect x="808" y="806" width="1" height="48"/><rect x="812" y="806" width="1" height="62"/><rect x="816" y="806" width="1" height="48"/><rect x="820" y="806" width="2" height="48"/><rect x="824" y="806" width="1" height="48"/><rect x="828" y="806" width="1" height="48"/><rect x="832" y="806" width="1" height="62"/><rect x="836" y="806" width="2" height="48"/><rect x="840" y="806" width="1" height="48"/><rect x="844" y="806" width="1" height="48"/><rect x="848" y="806" width="1" height="48"/><rect x="852" y="806" width="2" height="62"/><rect x="856" y="806" width="1" height="48"/><rect x="860" y="806" width="1" height="48"/><rect x="864" y="806" width="1" height="48"/><rect x="868" y="806" width="2" height="48"/><rect x="872" y="806" width="1" height="62"/><rect x="876" y="806" width="1" height="48"/><rect x="880" y="806" width="1" height="48"/><rect x="884" y="806" width="2" height="48"/><rect x="888" y="806" width="1" height="48"/><rect x="892" y="806" width="1" height="62"/><rect x="896" y="806" width="1" height="48"/><rect x="900" y="806" width="2" height="48"/><rect x="904" y="806" width="1" height="48"/><rect x="908" y="806" width="1" height="48"/><rect x="912" y="806" width="1" height="62"/><rect x="916" y="806" width="2" height="48"/><rect x="920" y="806" width="1" height="48"/>
  </g>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".8"/>
</svg>